name: Validate Skill Release

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repository contract
        shell: pwsh
        run: python .\scripts\validate_release.py

      - name: Run unit tests without models
        shell: pwsh
        run: python -m unittest discover -s .\skills\meeting-audio-transcription-analysis\tests -v

      - name: Compile Python sources
        shell: pwsh
        run: |
          $files = Get-ChildItem .\skills\meeting-audio-transcription-analysis -Recurse -Filter *.py
          foreach ($file in $files) {
            python -m py_compile $file.FullName
          }
